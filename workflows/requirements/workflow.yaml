name: requirements
description: 需求构建流程——收集需求 → 写文档 → 用户确认 → 有问题改 → 循环至定稿。作为 feature 等代码流程的前置输入。非代码任务。

# 不强制 verify：需求文档无需机械"测试"（req-check 结构校验保留为可选工具，
# 用户在 review 阶段确认时如需可自行运行）。结构完整性由 gate-check/validate 的 sections 兜底。

# 任务开始前
pre_task:
  - skill: skills/framework/state-checkpoint.md
    action: init

stages:
  - name: elicitation
    executor: subagent
    skill: skills/requirements/elicitation.md
    input: task.md
    output: task.md
    sections:
      - [## 背景与目标]
      - [## 待确认问题]
    gate: user_approval
    post_stage:
      - skill: skills/framework/state-checkpoint.md
        action: save
      - action: skill-log

  - name: drafting
    executor: subagent
    skill: skills/requirements/drafting.md
    input: [task.md]
    output: task.md
    sections:
      - [## 背景与目标]
      - [## 范围]
      - [## 功能需求]
      - [## 验收标准]
      - [## 待确认问题]
    gate: none
    on_fail: elicitation
    post_stage:
      - skill: skills/framework/state-checkpoint.md
        action: save
      - action: skill-log

  - name: review
    executor: inline
    skill: skills/requirements/review.md
    input: [task.md]
    output: task.md
    sections:
      - [## 背景与目标]
      - [## 范围]
      - [## 功能需求]
      - [## 验收标准]
      - [## 待确认问题]
    gate: user_approval
    on_fail: drafting
    post_stage:
      - skill: skills/framework/state-checkpoint.md
        action: save
      - action: skill-log

  - name: reflecting
    executor: inline
    skill: skills/framework/reflecting.md
    sub_command: reflect
    input: [task.md, execution-log.md]
    output: lessons-draft.md
    sections: []
    post_stage:
      - skill: skills/framework/state-checkpoint.md
        action: complete

post_task:
  - skill: skills/framework/reflecting.md
    sub_command: collect
    trigger: manual
