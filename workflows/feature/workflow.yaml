name: feature
description: 新功能开发流程

# 工作流验证手段（测试手段定义，见 docs/workflow-plugin-spec.md）
# checks: 内置 check（skill-check 等）或命令池 key（unit/lint/e2e，从 knowledge/verify.config.json 解析）
verify:
  checks: [unit, lint]

# 任务开始前
pre_task:
  - skill: skills/framework/state-checkpoint.md
    action: init

stages:
  - name: designing
    skill: knowledge/skills/designing/skill.md
    input: task.md
    output: design.md
    sections:
      - [## Summary for downstream]
      - [## Decision Log]
    require_verify: false
    permission: read-only
    tools: read+bash
    gate: user_approval
    post_stage:
      - skill: skills/framework/state-checkpoint.md
        action: save
      - action: skill-log

  - name: task-planning
    skill: knowledge/skills/task-planning/skill.md
    input: [task.md, design.md]
    output: task-plan.md
    sections:
      - [## Summary for downstream]
      - [## Decision Log]
    require_verify: false
    permission: read-only
    tools: read+bash
    gate: user_approval
    post_stage:
      - skill: skills/framework/state-checkpoint.md
        action: save
      - action: skill-log

  - name: implementing
    skill: knowledge/skills/implementing/skill.md
    input: [task.md, design.md, task-plan.md]
    output: changes.md
    sections:
      - [## Summary for downstream]
    require_verify: false
    permission: workspace-write
    tools: code-mode
    gate: none
    post_stage:
      - skill: skills/framework/state-checkpoint.md
        action: save
      - action: skill-log

  - name: testing
    skill: knowledge/skills/testing/skill.md
    input: [task.md, task-plan.md, changes.md]
    output: test-report.md
    sections:
      - [## Summary for downstream]
      - [## 完整性声明, ## Anti-Cherry-Pick Declaration]
    require_verify: true
    permission: workspace-write
    tools: code-mode
    gate: user_approval
    on_fail: implementing
    post_stage:
      - skill: skills/framework/state-checkpoint.md
        action: save
      - action: skill-log

  - name: reviewing
    skill: knowledge/skills/reviewing/skill.md
    input: [design.md, changes.md, test-report.md]
    output: review-report.md
    sections:
      - [## Summary for downstream]
      - [## Anti-Cherry-Pick Declaration]
    require_verify: true
    permission: read-only
    tools: read+bash
    gate: user_approval
    on_fail: implementing
    post_stage:
      - skill: skills/framework/state-checkpoint.md
        action: save
      - action: skill-log

  - name: reflecting
    skill: skills/framework/reflecting.md
    sub_command: reflect
    input: [task.md, design.md, task-plan.md, test-report.md, review-report.md, execution-log.md]
    output: lessons-draft.md
    sections: []
    require_verify: false
    permission: read-only
    tools: read+bash
    post_stage:
      - skill: skills/framework/state-checkpoint.md
        action: save

  - name: git-operations
    skill: knowledge/skills/git-operations/skill.md
    sub_command: commit
    input: [changes.md, review-report.md]
    output: changes.md
    sections: []
    require_verify: false
    permission: workspace-write
    tools: bash
    gate: user_approval
    optional: true
    post_stage:
      - skill: skills/framework/state-checkpoint.md
        action: complete

# 任务结束后（可选）
# 用户审核草稿后，通过以下方式调用阶段二：
#   - 对话中说"收集经验"或"reflecting collect"
#   - 执行 reflecting collect {task-id}
post_task:
  - skill: skills/framework/reflecting.md
    sub_command: collect
    trigger: manual
